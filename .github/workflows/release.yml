name: release

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, so gitleaks can scan every commit
      - name: Secret scan (full history)
        # explicit CLI instead of gitleaks-action: the action scans the
        # push range base..head, and on the first push base=root^ does not
        # exist -> "failed to scan" with zero leaks found (proven in CI)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz
          ./gitleaks detect --source . --redact --log-opts=--no-merges
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linters (versions pinned to .clang-format semantics)
        run: pip install "clang-format==23.1.*" cppcheck ruff semgrep flawfinder bandit vulture codespell
      - name: clang-format check
        # src/ only: legacy/ holds the frozen single-file ports, not maintained
        # to house style (every other linter in this job also targets src/ only)
        run: clang-format --dry-run -Werror $(git ls-files 'src/*.c' 'src/*.h')
      - name: cppcheck
        run: cppcheck --error-exitcode=1 --enable=warning,style,portability
                       --language=c --std=c11 -Isrc src/*.c
      - name: flawfinder (C security linter)
        run: flawfinder --minlevel=4 src/ --exclude=src/util.c
      - name: semgrep
        run: semgrep scan --error --quiet --config p/default --config p/security-audit src vmnet_cli
      - name: bandit (Python security linter)
        # B104 (bind 0.0.0.0) is meaningless here: no server code exists;
        # the literal appears only as adversarial fuzz input.
        run: bandit -q -r -ll --skip B104 vmnet_cli tools tests
      - name: vulture (dead code)
        run: vulture --min-confidence 90 vmnet_cli
      - name: codespell
        run: codespell src vmnet_cli tools tests RECON.md README.md
      - name: ruff
        run: |
          ruff check vmnet_cli tools tests
          ruff format --check vmnet_cli tools tests

  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  build-exe:
    # Cross-compile the native C implementation to a self-contained x64 PE
    # with MinGW-w64 — same toolchain and flags as the reference build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64
      - name: Compile vmnet-cli.exe
        run: |
          V=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          IFS='.' read -r MA MI PA <<< "$V"
          # Debian's mingw gcc does not recognize .rc suffixes (passes them
          # to ld -> syntax error) and its .res output is not accepted by
          # that ld either; emit a linkable COFF object explicitly
          x86_64-w64-mingw32-windres -DVER_MAJOR=$MA -DVER_MINOR=$MI -DVER_PATCH=$PA \
            -O coff -i src/version.rc -o version.o
          x86_64-w64-mingw32-gcc -O2 -s -static -Wall -Isrc \
            -DVER_MAJOR=$MA -DVER_MINOR=$MI -DVER_PATCH=$PA \
            -Wl,--no-insert-timestamp \
            -o vmnet-cli-windows-x64.exe src/*.c version.o \
            -ladvapi32 -liphlpapi -lsetupapi
          file vmnet-cli-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: vmnet-cli-windows-x64.exe

  release:
    # tag pushes only — on branch pushes there is nothing to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-python, build-exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write        # sigstore: keyless signing via OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
      - name: Sign release assets (sigstore keyless)
        # pinned exact: this repo publishes no moving major tags (v2/v3 404)
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          release-signing-artifacts: true

  publish-pypi:
    # Trusted publishing to PyPI (publisher: owner fl0l0u, repo vmnet-cli,
    # workflow release.yml, environment BLANK - must stay in sync with the
    # PyPI config: a job environment here would add an environment_name
    # claim that a blank publisher does not match)
    needs: build-python
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        # idempotent re-runs: v0.1.0 may already be on PyPI, and duplicate
        # uploads are a hard 400 otherwise (proven: first release run
        # published fine but the release job failed on a bad action ref)
        with:
          skip-existing: true
